schema_version: 1
dataset: hiba
status: benign_vocabulary_mapped_pending_full_audit
matching_policy:
  method: exact_after_unicode_casefold_and_whitespace_normalization
  substring_matching_allowed: false
  unknown_value_policy: exclude_and_block_approval
  preserve_original_diagnosis: true

licence_policy:
  status: prospective_fail_closed
  preserve_original_value: true
  matching_method: exact_after_unicode_casefold_and_whitespace_normalization
  accepted_values:
    - CC-BY
  unknown_unsupported_conflicting_or_missing_policy: exclude_and_block_approval

final_classes:
  - non_malignant
  - melanoma
  - bcc
  - scc

mappings:
  melanoma:
    canonical_diagnosis: melanoma
    mapped_final_label: melanoma
    mapped_stage_1_label: malignant
    mapped_stage_2_label: melanoma
    include_primary_evaluation: true
    exclusion_reason: ""
  basal cell carcinoma:
    canonical_diagnosis: basal_cell_carcinoma
    mapped_final_label: bcc
    mapped_stage_1_label: malignant
    mapped_stage_2_label: bcc
    include_primary_evaluation: true
    exclusion_reason: ""
  squamous cell carcinoma:
    canonical_diagnosis: squamous_cell_carcinoma
    mapped_final_label: scc
    mapped_stage_1_label: malignant
    mapped_stage_2_label: scc
    include_primary_evaluation: true
    exclusion_reason: ""
  actinic keratosis:
    canonical_diagnosis: actinic_keratosis
    mapped_final_label: ""
    mapped_stage_1_label: ""
    mapped_stage_2_label: ""
    include_primary_evaluation: false
    exclusion_reason: excluded_actinic_keratosis_primary_mapping
  nevus:
    canonical_diagnosis: melanocytic_nevus
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""
  seborrheic keratosis:
    canonical_diagnosis: benign_keratosis_like_lesion
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""
  dermatofibroma:
    canonical_diagnosis: dermatofibroma
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""
  vascular lesion:
    canonical_diagnosis: vascular_lesion
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""
  solar lentigo:
    canonical_diagnosis: benign_keratosis_like_lesion
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""
  lichenoid keratosis:
    canonical_diagnosis: benign_keratosis_like_lesion
    mapped_final_label: non_malignant
    mapped_stage_1_label: non_malignant
    mapped_stage_2_label: ""
    include_primary_evaluation: true
    exclusion_reason: ""

resolved_entries:
  - category: benign_diagnosis_vocabulary
    status: resolved_against_observed_hiba_metadata_2026_08_31
    note: >
      Mapped against the actual diagnosis vocabulary observed in the official
      HIBA collection 251 metadata (nevus, seborrheic keratosis, dermatofibroma,
      vascular lesion, solar lentigo, lichenoid keratosis) -- all recognized as
      non_malignant here, consistent with this project's own ISIC2019
      flat_four_class_v1 mapping (src/data/isic2019_dataset.py), which already
      treats melanocytic_nevus, benign_keratosis_like_lesion (the ISIC BKL
      superclass covering seborrheic/solar-lentigo/lichenoid-keratosis
      subtypes), dermatofibroma, and vascular_lesion identically. Any
      diagnosis string not listed under mappings above is still excluded and
      blocks approval, per matching_policy.unknown_value_policy.
excluded_categories:
  ambiguous: excluded_ambiguous_diagnosis
  unsupported: excluded_unsupported_diagnosis
  unknown: excluded_unknown_diagnosis
  non_diagnostic: excluded_non_diagnostic_label
